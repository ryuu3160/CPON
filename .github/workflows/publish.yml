name: publish

# Releaseを公開すると、添付された .nupkg を nuget.org へ push する
on:
  release:
    types: [published]

permissions:
  id-token: write # Trusted Publishing に必須
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download nupkg from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ github.event.release.tag_name }}" --repo "${{ github.repository }}" --pattern "*.nupkg"

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ryuu3160 # nuget.org のプロフィール名(メールアドレスではない)

      - name: Push
        run: dotnet nuget push *.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
